  <text x="127" y="79" text-anchor="middle" font-size="9" font-style="italic" fill="#d6eaf8">[Next.js]</text>
  <text x="127" y="91" text-anchor="middle" font-size="9" fill="white">Trimite user_id, topic_id.</text>
