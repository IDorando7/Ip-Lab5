  </defs>
  <text x="490" y="20" text-anchor="middle" font-size="13" font-weight="bold">C4 Level 3: Component Diagram — Main Backend API</text>
  <rect x="50" y="35" width="155" height="75" rx="5" fill="#2980b9"/>
  <text x="127" y="51" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
