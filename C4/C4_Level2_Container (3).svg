<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="680" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
  <text x="450" y="22" text-anchor="middle" font-size="13" font-weight="bold">C4 Level 2: Container Diagram — AI Question Recommendation System</text>
  <circle cx="450" cy="55" r="15" fill="#1a5276"/>
  <ellipse cx="450" cy="75" rx="18" ry="9" fill="#1a5276"/>
  <rect x="385" y="82" width="130" height="65" rx="5" fill="#1a5276"/>
  <text x="450" y="97" text-anchor="middle" font-size="9" font-style="italic" fill="white">«person»</text>
  <text x="450" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Student</text>
  <text x="450" y="126" text-anchor="middle" font-size="9" fill="white">Utilizatorul platformei</text>
  <text x="450" y="138" text-anchor="middle" font-size="9" fill="white">adaptive.</text>
  <line x1="415" y1="147" x2="270" y2="192" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#333">Foloseste</text>
  <text x="290" y="181" text-anchor="middle" font-size="9" font-style="italic" fill="#666">[HTTPS]</text>
  <rect x="50" y="180" width="800" height="360" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="198" font-size="11" font-weight="bold" fill="#666">AI Question Recommendation System [system]</text>
  <rect x="80" y="207" width="160" height="90" rx="5" fill="#2980b9"/>
  <text x="160" y="223" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="160" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Frontend App</text>
  <text x="160" y="250" text-anchor="middle" font-size="9" font-style="italic" fill="#d6eaf8">[Next.js]</text>
  <text x="160" y="264" text-anchor="middle" font-size="9" fill="white">Interfata utilizator;</text>
  <text x="160" y="276" text-anchor="middle" font-size="9" fill="white">afiseaza intrebari.</text>
  <line x1="240" y1="252" x2="330" y2="252" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="285" y="246" text-anchor="middle" font-size="9" fill="#333">Apeleaza</text>
  <text x="285" y="265" text-anchor="middle" font-size="9" font-style="italic" fill="#666">[JSON/HTTPS]</text>
  <rect x="330" y="207" width="185" height="90" rx="5" fill="#2980b9"/>
  <text x="422" y="223" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="422" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Main Backend API</text>
  <text x="422" y="250" text-anchor="middle" font-size="9" font-style="italic" fill="#d6eaf8">[Java / Spring Boot]</text>
  <text x="422" y="264" text-anchor="middle" font-size="9" fill="white">Orchestreaza recomandarea,</text>
  <text x="422" y="276" text-anchor="middle" font-size="9" fill="white">mastery si audit.</text>
  <line x1="515" y1="252" x2="610" y2="252" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="563" y="246" text-anchor="middle" font-size="9" fill="#333">Citeste/Scrie</text>
  <text x="563" y="265" text-anchor="middle" font-size="9" font-style="italic" fill="#666">[JDBC/ORM]</text>
  <rect x="610" y="207" width="175" height="90" rx="5" fill="#1a5276"/>
  <text x="697" y="223" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="697" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Relational Database</text>
  <text x="697" y="250" text-anchor="middle" font-size="9" font-style="italic" fill="#d6eaf8">[PostgreSQL]</text>
  <text x="697" y="264" text-anchor="middle" font-size="9" fill="white">Stocheaza intrebari,</text>
  <text x="697" y="276" text-anchor="middle" font-size="9" fill="white">raspunsuri, audit log.</text>
  <line x1="380" y1="297" x2="245" y2="370" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="278" y="334" text-anchor="middle" font-size="9" fill="#333">Inferenta mastery</text>
  <text x="278" y="345" text-anchor="middle" font-size="9" font-style="italic" fill="#666">[API/HTTP]</text>
  <line x1="465" y1="297" x2="600" y2="370" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="558" y="334" text-anchor="middle" font-size="9" fill="#333">Genereaza intrebari</text>
  <text x="558" y="345" text-anchor="middle" font-size="9" font-style="italic" fill="#666">[API/HTTP]</text>
  <rect x="100" y="372" width="200" height="90" rx="5" fill="#2980b9"/>
  <text x="200" y="388" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="200" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ML Inference Service</text>
  <text x="200" y="415" text-anchor="middle" font-size="9" font-style="italic" fill="#d6eaf8">[Python / TensorFlow]</text>
  <text x="200" y="429" text-anchor="middle" font-size="9" fill="white">Estimeaza mastery al</text>
  <text x="200" y="441" text-anchor="middle" font-size="9" fill="white">studentului per topic.</text>
  <rect x="520" y="372" width="210" height="90" rx="5" fill="#2980b9"/>
  <text x="625" y="388" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="625" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Question Generation</text>
  <text x="625" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Engine</text>
  <text x="625" y="429" text-anchor="middle" font-size="9" font-style="italic" fill="#d6eaf8">[Python / LLM]</text>
  <text x="625" y="443" text-anchor="middle" font-size="9" fill="white">Genereaza intrebari noi (fallback).</text>
  <line x1="200" y1="462" x2="200" y2="518" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="212" y="494" font-size="9" fill="#333">Incarca model</text>
  <text x="212" y="505" font-size="9" font-style="italic" fill="#666">[API]</text>
  <rect x="110" y="520" width="180" height="70" rx="5" fill="#2980b9"/>
  <text x="200" y="537" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="200" y="551" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Model Registry</text>
  <text x="200" y="565" text-anchor="middle" font-size="9" fill="white">Versionare si stocare</text>
  <text x="200" y="577" text-anchor="middle" font-size="9" fill="white">modele ML.</text>
  <rect x="360" y="520" width="180" height="70" rx="5" fill="#2980b9"/>
  <text x="450" y="537" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="450" y="551" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Model Training Service</text>
  <text x="450" y="565" text-anchor="middle" font-size="9" fill="white">Antreneaza periodic</text>
  <text x="450" y="577" text-anchor="middle" font-size="9" fill="white">modele noi.</text>
  <rect x="610" y="520" width="160" height="70" rx="5" fill="#2980b9"/>
  <text x="690" y="537" text-anchor="middle" font-size="9" font-style="italic" fill="white">«container»</text>
  <text x="690" y="551" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Dataset Builder</text>
  <text x="690" y="565" text-anchor="middle" font-size="9" fill="white">Construieste seturi de</text>
  <text x="690" y="577" text-anchor="middle" font-size="9" fill="white">date pentru antrenament.</text>
  <line x1="200" y1="462" x2="450" y2="518" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="295" y="492" font-size="9" fill="#333">Inregistreaza model</text>
  <text x="295" y="503" font-size="9" font-style="italic" fill="#666">[API]</text>
  <line x1="625" y1="462" x2="690" y2="518" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="635" y="495" font-size="9" fill="#333">Construieste dataset</text>
  <text x="635" y="506" font-size="9" font-style="italic" fill="#666">[API]</text>
</svg>
